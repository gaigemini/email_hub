# A generic Alembic configuration file.
#
# Refer to the documentation for colors, filters,
# TEMPLATES, formatting, etc.

[alembic]
# path to migration scripts
script_location = alembic

# template for migration file names
# file_template = %%(rev)s_%%(slug)s

# Set to 'true' to allow .pyc files to be generated
# pyc_file = false

# --- THIS IS THE FIX ---
# We REMOVE the sqlalchemy.url line from here.
# Our env.py script sets this from the environment variable.
# sqlalchemy.url = %(DATABASE_URL)s
# ---------------------

# Other settings, truncated for brevity
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

